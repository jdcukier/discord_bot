version: 2

# Every merge to main redeploys the bot, so batch routine updates across all
# ecosystems into a single monthly PR (one deploy) instead of one PR per package.
multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "monthly"

updates:
  # Discord bot (vendored Go modules)
  - package-ecosystem: "gomod"
    directory: "/"
    multi-ecosystem-group: "monthly-dependencies"
    patterns: ["*"]
    groups:
      go-security:
        applies-to: "security-updates"
        patterns: ["*"]

  # Spotify worker deploy tooling (wrangler)
  - package-ecosystem: "npm"
    directory: "/tools/cloudflare-auth"
    multi-ecosystem-group: "monthly-dependencies"
    patterns: ["*"]
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns: ["*"]

  # Spotify worker Python dependencies
  - package-ecosystem: "uv"
    directory: "/tools/cloudflare-auth"
    multi-ecosystem-group: "monthly-dependencies"
    patterns: ["*"]
    groups:
      uv-security:
        applies-to: "security-updates"
        patterns: ["*"]

  # Workflow actions (actions/checkout, docker/*, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "monthly-dependencies"
    patterns: ["*"]
