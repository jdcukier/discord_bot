version: '3.8'

services:
  discord-bot:
    build: .
    image: jcukier/discord-bot:latest
    container_name: discord-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Playlist tags managed with /tag; the volume keeps them across redeploys
      SPOTIFY_TAGS_FILE: /data/playlist-tags.json
    volumes:
      - discord-bot-data:/data
    networks:
      - discord-bot-network

volumes:
  discord-bot-data:

networks:
  discord-bot-network:
    driver: bridge
